name: "GCP Infrastructure Automation"

on:
  push:
    branches:
      - main
    paths:
      - 'platforms/gcp/**'
      - '.github/workflows/terraform-gcp.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'platforms/gcp/**'
      - '.github/workflows/terraform-gcp.yml'

# Запрашиваем OIDC-токен у GitHub для аутентификации в GCP
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    name: "Terraform GCP Plan & Apply"
    runs-on: ubuntu-latest
    # Возвращаем рабочую директорию на уровень джобы, чтобы не прописывать её вручную в каждом шаге
    defaults:
      run:
        working-directory: platforms/gcp

    steps:
      # 1. Забираем исходный код из репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Безопасная аутентификация в GCP через Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # 3. Настраиваем Google Cloud SDK в окружении runner
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # 4. Устанавливаем и настраиваем Terraform (с отключением CLI-обертки)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # 5. Проверяем форматирование HCL-кода
      - name: Terraform Format Check
        run: terraform fmt -check

      # 6. Инициализируем Terraform и подключаем remote backend (GCS)
      - name: Terraform Init
        run: terraform init

      # 7. Проверяем синтаксическую валидность манифестов
      - name: Terraform Validate
        run: terraform validate

      # 8. Формируем план изменений
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: false

      # 9. Если это мёрж в main — применяем изменения
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false